
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Failed</title>

    <style>

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .failure {
            color: #f44336;
            font-size: 50px;
        }

        pre {
            margin-top: 30px;
            text-align: left;
            background: #1e1e1e;
            color: #ddd;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="failure">
        ✕
    </div>

    <h1>Payment Failed</h1>

    <p>
        The eSewa payment was not completed.
    </p>

    <h2>eSewa Response</h2>

    <pre id="response"></pre>

    <a href="index.html">
        Try Again
    </a>

</div>


<script>

    /*
     * Read query parameters returned
     * by eSewa.
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const response = {};


    for (const [key, value] of params.entries()) {

        response[key] = value;

    }


    document.getElementById(
        "response"
    ).textContent =
        JSON.stringify(response, null, 4);

</script>

</body>

</html>
