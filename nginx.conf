# ==============================================================================
# Nginx Configuration for VehicleRental Django API
# Place this file in: /etc/nginx/sites-available/vehicle_rental
# Enable with: sudo ln -s /etc/nginx/sites-available/vehicle_rental /etc/nginx/sites-enabled/
# ==============================================================================

# Upstream pointing to Gunicorn running locally
upstream django_gunicorn {
    server 127.0.0.1:8000;
    # Or if using UNIX domain socket:
    # server unix:/var/www/vehicle_rental/backend/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name your_domain.com www.your_domain.com your_server_ip;

    # Maximum upload size for vehicle images and files
    client_max_body_size 25M;

    # Logging
    access_log /var/log/nginx/vehicle_rental_access.log;
    error_log /var/log/nginx/vehicle_rental_error.log;

    # Static files collected via: python manage.py collectstatic
    location /static/ {
        alias /var/www/vehicle_rental/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # User-uploaded media files (vehicle images, receipts, etc.)
    location /media/ {
        alias /var/www/vehicle_rental/backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Favicon and Robots handling
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    location = /robots.txt { 
        access_log off; 
        log_not_found off; 
    }

    # Proxy all application requests to Gunicorn
    location / {
        proxy_pass http://django_gunicorn;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long requests
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
    }
}
